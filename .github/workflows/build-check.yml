name: Build Check

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Production build smoke check
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, curl, dom, fileinfo, xml, zip, intl
          coverage: none

      - name: Install Composer dependencies (production only)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build frontend assets
        run: yarn build

      - name: Cache configuration, routes and views
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Run migrations (database connection check)
        run: php artisan migrate --force
